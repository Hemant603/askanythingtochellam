<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chellam Sir Here...</title>
</head>
<link rel="stylesheet" href="album.css">
<body>
    <div id="chellamsirdiv">
        <img id="chellamsir" src="chellamSir.webp" alt="">
    </div>

    <div class="search">
        <input id="textsearch" type="text" placeholder="  Ask here..." onchange="handleInputChange(event)">
        <button id="spkbtn" onclick="runSpeechRecog()"><img id="speaker" src="mics.jpg" alt=""></button>   
    </div>

    <div id="srcbtn">
        <a id="dynamicLink">
            <button class="spkbtn1" type="button" onclick="search(document.getElementById('textsearch').value)">Ask</button>
        </a>
    </div>

    <div class="search">
        <p id="text" onchange="show()"></p>
    </div>

    <div class="form-container">
        <form id="contactForm">
            <h2>Contact Details Form</h2>
            <label for="firstname">Name:</label>
            <input type="text" id="firstname" name="firstname" required>

            <label for="lastname">Name:</label>
            <input type="text" id="lastname" name="lastname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button id="submitButton" type="submit">Submit</button>
        </form>
    </div>
    <script src="salesforcePush.js"></script>
</body>
</html>
